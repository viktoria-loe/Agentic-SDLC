# Stage 1 of our own reviewer: Copilot CLI reviews each ready pull request
# against the review-pr skill and posts one summary comment.
#
# It opens no threads and is not a required check, so it cannot block a merge
# yet; it runs beside Copilot code review so the two can be compared. Stage 2
# turns blocking findings into threads and lets the merge gate read the verdict.
#
# Safeguards:
# - The rubric, AGENTS.md and CLAUDE.md are read from master, never from the
#   pull request, so a pull request cannot change what reviews it.
# - The pull request and its ticket are untrusted text. The reviewer gets no
#   GitHub token, no built-in MCP servers, no shell and no write tool: it can
#   only read files, so the worst a prompt injection can do is a wrong review.
# - COPILOT_REVIEW_TOKEN can only spend Copilot requests. It is kept apart from
#   COPILOT_ASSIGN_TOKEN, which can write to the repository.
# - Posting the comment is a separate job with its own token; the review job
#   cannot write to the pull request.
# - Untrusted text reaches shell steps only through files and environment
#   variables, never through ${{ }} inside run:.
#
# On Copilot's pull requests this run waits for approval like our other
# workflows; mark-ready's release-checks re-runs it when no .github/ file changed.
name: Review

on:
  pull_request:
    branches: [ master ]
    types: [ opened, ready_for_review, synchronize, reopened ]

permissions: {}

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a newer commit makes this review stale

jobs:
  review:
    # Skip drafts, Dependabot and forks: the last two get no repository secrets.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }} # the commit the merge gate checks the review against
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the rubric and instructions from master
        uses: actions/checkout@v7
        with:
          ref: master
          path: .factory
          sparse-checkout: |
            .github/skills
            .github/instructions
          persist-credentials: false

      # The reviewer gets no shell, so the workflow hands it the changes as files.
      - name: Write the diff and commit messages to files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "$BASE...HEAD" > diff.patch
          git log --format='%h %s%n%n%b' "$BASE..HEAD" > commits.txt

      # Copilot CLI reads skills and instructions from the working directory, so
      # without this the pull request's own copies would review it. The diff still
      # shows any change to them, as data.
      - name: Use master's skills and instructions, not the pull request's
        run: |
          rm -rf .github/skills .github/instructions .github/copilot-instructions.md AGENTS.md CLAUDE.md
          for path in .github/skills .github/instructions .github/copilot-instructions.md AGENTS.md CLAUDE.md; do
            if [ -e ".factory/$path" ]; then
              mkdir -p "$(dirname "$path")"
              cp -r ".factory/$path" "$path"
            fi
          done

      - name: Fetch the pull request and its ticket
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body \
            --jq '"# " + .title + "\n\n" + .body' > pr.md
          ticket=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[0].number // empty')
          if [ -n "$ticket" ]; then
            gh issue view "$ticket" --repo "$GITHUB_REPOSITORY" --json title,body \
              --jq '"# " + .title + "\n\n" + .body' > ticket.md
          else
            echo "No linked ticket." > ticket.md
          fi

      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.116 # pinned; a person bumps it on purpose

      - name: Review
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN }}
          COPILOT_SKILLS_DIRS: .factory/.github/skills
        # No --allow-tool: in -p mode anything not pre-approved is refused, so the
        # reviewer can read files but cannot run commands or write.
        run: |
          copilot -p "Use the review-pr skill. The changes are in diff.patch and their commit messages in commits.txt; the changed files are in the working directory. The ticket is in ticket.md and the pull request description in pr.md. Reply with only the skill's output format." \
            --model claude-sonnet-5.5 \
            --deny-tool=write \
            --disable-builtin-mcps \
            --no-ask-user \
            -s > review.md
          if ! grep -q '^Verdict:' review.md; then
            echo "::error::The review has no verdict line; not posting it."
            cat review.md
            exit 1
          fi
          cat review.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: review
          path: review.md

  comment:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: review

      - name: Post the review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # One comment per pull request, updated on each run.
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file review.md --edit-last --create-if-none
