# Decides who merges each open pull request to master: the factory (tier 0)
# or a person (tier 1), from .github/merge-policy.yml on master. It writes the
# decision between the factory-notes markers in the pull request body, and
# adds needs-person for tier 1.
#
# In suggest mode it approves and merges nothing, so the built-in token is
# enough. Auto mode will add the factory App to approve and merge tier 0.
#
# Never trigger this on pull_request or pull_request_review: those run the
# pull request's own copy of this file, which could approve itself. Schedule
# and workflow_dispatch run master's copy, and the job refuses any other ref.
name: Merge gate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read        # the policy file and each pull request's files
  pull-requests: write  # the factory notes in the body
  issues: write         # the needs-person label
  checks: read
  statuses: read

# The gate acts, so runs queue; none is cut off halfway.
concurrency:
  group: merge-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Read the merge policy from master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/contents/.github/merge-policy.yml?ref=master" --jq .content \
            | base64 -d | yq -o=json > policy.json
          cat policy.json

      - name: Decide each pull request's tier
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const policy = JSON.parse(fs.readFileSync('policy.json', 'utf8'));
            if (policy.mode === 'off') { core.info('Merge gate is off.'); return; }

            // Paths that always need a person, whatever the policy says.
            const HARD_LIMITS = ['.github/**', '.claude/**', 'AGENTS.md', 'CLAUDE.md'];
            // Not called "glob": github-script already defines that name.
            const pathPattern = g => new RegExp('^' + g.split('**').map(part =>
              part.split('*').map(s => s.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('[^/]*')).join('.*') + '$');
            const hard = HARD_LIMITS.map(pathPattern);
            const human = (policy.require_human_paths ?? []).map(pathPattern);

            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'master' });

            for (const pr of prs) {
              if (pr.draft) continue;
              const reasons = [];
              const labels = pr.labels.map(l => l.name);

              // 1. What the pull request changes
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
              for (const f of files) {
                if (hard.some(r => r.test(f.filename))) reasons.push(`factory file \`${f.filename}\``);
                else if (human.some(r => r.test(f.filename))) reasons.push(`path needs a person: \`${f.filename}\``);
              }
              const changed = files.reduce((n, f) => n + f.additions + f.deletions, 0);
              if (changed > policy.max_changed_lines) reasons.push(`${changed} changed lines, over ${policy.max_changed_lines}`);
              if (labels.includes('hold')) reasons.push('a person added the hold label');

              // 2. The ticket it closes, its checks, and when it became ready
              const { repository: { pullRequest: p } } = await github.graphql(`
                query($owner: String!, $repo: String!, $n: Int!) {
                  repository(owner: $owner, name: $repo) { pullRequest(number: $n) {
                    closingIssuesReferences(first: 10) { nodes { number labels(first: 30) { nodes { name } } } }
                    commits(last: 1) { nodes { commit { committedDate statusCheckRollup { state } } } }
                    timelineItems(itemTypes: [READY_FOR_REVIEW_EVENT], last: 1) { nodes { ... on ReadyForReviewEvent { createdAt } } }
                  } } }`, { owner, repo, n: pr.number });

              // Missing information sends the pull request to a person.
              const tickets = p.closingIssuesReferences.nodes;
              if (tickets.length === 0) reasons.push('no linked ticket');
              for (const t of tickets) {
                const tl = t.labels.nodes.map(l => l.name);
                if (tl.includes('type:spike')) reasons.push(`#${t.number} is a spike: spikes never merge`);
                if (!tl.includes('risk:low')) reasons.push(`#${t.number} is not low risk`);
              }

              const head = p.commits.nodes[0].commit;
              const checks = head.statusCheckRollup?.state ?? 'NONE';
              const readyAt = p.timelineItems.nodes[0]?.createdAt ?? pr.created_at;
              const since = Math.max(Date.parse(head.committedDate), Date.parse(readyAt));
              const mergeAfter = new Date(since + policy.hold_minutes * 60000).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';

              // 3. The decision, written between the factory-notes markers
              const tier = reasons.length ? 1 : 0;
              const note = tier === 1
                ? `**Merge gate (${policy.mode}): a person merges this.**\n${reasons.map(r => `- ${r}`).join('\n')}`
                : `**Merge gate (${policy.mode}): the factory may merge this** after ${mergeAfter}, once checks pass ` +
                  `(now: ${checks}), unless someone adds the \`hold\` label.`;

              const block = `<!-- factory-notes:start -->\n${note}\n<!-- factory-notes:end -->`;
              const body = pr.body ?? '';
              const marked = /<!-- factory-notes:start -->[\s\S]*?<!-- factory-notes:end -->/;
              const newBody = marked.test(body) ? body.replace(marked, () => block) : `${body}\n\n${block}`;
              if (newBody !== body) await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: newBody });

              const flagged = labels.includes('needs-person');
              if (tier === 1 && !flagged) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['needs-person'] });
              if (tier === 0 && flagged) await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: 'needs-person' });

              core.info(`#${pr.number}: tier ${tier}${tier ? ' (' + reasons.join('; ') + ')' : ''}`);
            }
