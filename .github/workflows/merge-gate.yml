# Decides who merges each open pull request to master: the factory (tier 0)
# or a person (tier 1), from .github/merge-policy.yml on master. It writes the
# decision between the factory-notes markers in the pull request body, and
# adds needs-person for tier 1.
#
# In auto mode, a tier 0 pull request is approved and merged by the factory App
# once every check is green, our reviewer's (review.yml) verdict on the head
# commit is pass, no review thread is open and the hold has passed. The hold
# starts with a notice the gate posts once everything else is done, naming the
# people in hold_notify, so the chance to add `hold` is always seen. A pull
# request whose review used three fix rounds goes to a person, and so does one
# where Copilot was asked to fix the review and has not pushed within
# copilot_fix_timeout_hours. The App is not a
# ruleset bypass actor, so the ruleset still applies to its merge. In suggest
# mode it approves and merges nothing.
#
# Never trigger this on pull_request or pull_request_review: those run the
# pull request's own copy of this file, which could approve itself. Schedule
# and workflow_dispatch run master's copy, and the job refuses any other ref.
name: Merge gate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read        # the policy file and each pull request's files
  pull-requests: write  # the factory notes in the body
  issues: write         # the needs-person label
  checks: read
  statuses: read

# The gate acts, so runs queue; none is cut off halfway.
concurrency:
  group: merge-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Read the merge policy from master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/contents/.github/merge-policy.yml?ref=master" --jq .content \
            | base64 -d | yq -o=json > policy.json
          cat policy.json

      - name: Decide each pull request's tier
        id: decide
        uses: actions/github-script@v9
        env:
          REVIEWER: ${{ vars.REVIEWER_APP_SLUG }} # the reviewer App's login, without [bot]
        with:
          script: |
            const fs = require('fs');
            const policy = JSON.parse(fs.readFileSync('policy.json', 'utf8'));
            if (policy.mode === 'off') { core.info('Merge gate is off.'); return; }

            // Paths that always need a person, whatever the policy says.
            const HARD_LIMITS = ['.github/**', '.claude/**', 'AGENTS.md', 'CLAUDE.md'];
            // Not called "glob": github-script already defines that name.
            const pathPattern = g => new RegExp('^' + g.split('**').map(part =>
              part.split('*').map(s => s.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('[^/]*')).join('.*') + '$');
            const hard = HARD_LIMITS.map(pathPattern);
            const human = (policy.require_human_paths ?? []).map(pathPattern);

            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'master' });
            const toMerge = [];  // tier 0 and ready: handed to the next step

            for (const pr of prs) {
              if (pr.draft) continue;
              const reasons = [];
              const labels = pr.labels.map(l => l.name);

              // 1. What the pull request changes
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
              for (const f of files) {
                if (hard.some(r => r.test(f.filename))) reasons.push(`factory file \`${f.filename}\``);
                else if (human.some(r => r.test(f.filename))) reasons.push(`path needs a person: \`${f.filename}\``);
              }
              const changed = files.reduce((n, f) => n + f.additions + f.deletions, 0);
              if (changed > policy.max_changed_lines) reasons.push(`${changed} changed lines, over ${policy.max_changed_lines}`);
              if (labels.includes('hold')) reasons.push('a person added the hold label');

              // 2. The ticket it closes, its checks, its review, and when it became ready
              const { repository: { pullRequest: p } } = await github.graphql(`
                query($owner: String!, $repo: String!, $n: Int!) {
                  repository(owner: $owner, name: $repo) { pullRequest(number: $n) {
                    closingIssuesReferences(first: 10) { nodes { number labels(first: 30) { nodes { name } } } }
                    commits(last: 1) { nodes { commit { oid statusCheckRollup { state } } } }
                    timelineItems(itemTypes: [READY_FOR_REVIEW_EVENT], last: 1) { nodes { ... on ReadyForReviewEvent { createdAt } } }
                    reviews(last: 50) { nodes { author { login } body submittedAt commit { oid } } }
                    reviewThreads(first: 100) { nodes { isResolved } }
                    comments(last: 100) { nodes { body createdAt } }
                  } } }`, { owner, repo, n: pr.number });

              // Missing information sends the pull request to a person.
              const tickets = p.closingIssuesReferences.nodes;
              if (tickets.length === 0) reasons.push('no linked ticket');
              for (const t of tickets) {
                const tl = t.labels.nodes.map(l => l.name);
                if (tl.includes('type:spike')) reasons.push(`#${t.number} is a spike: spikes never merge`);
                if (!tl.includes('risk:low')) reasons.push(`#${t.number} is not low risk`);
              }

              const head = p.commits.nodes[0].commit;
              const checks = head.statusCheckRollup?.state ?? 'NONE';

              // Our reviewer's latest verdict must be of the head commit and pass. A
              // verdict line counts only from the reviewer App (REVIEWER_APP_SLUG), an
              // identity no other workflow uses, and only the last one in a review's
              // body. With the variable unset nothing counts, so everything waits.
              const VERDICT = /<!-- review-pr:verdict=([a-z-]+) sha=([0-9a-f]{40}) round=(\d+) -->/g;
              const verdicts = p.reviews.nodes
                .filter(r => process.env.REVIEWER && r.author?.login === process.env.REVIEWER)
                .map(r => ({ review: r, m: [...(r.body ?? '').matchAll(VERDICT)].at(-1) }))
                .filter(v => v.m)
                .map(v => ({ submittedAt: v.review.submittedAt, commit: v.review.commit?.oid,
                             verdict: v.m[1], sha: v.m[2], round: Number(v.m[3]) }));
              const latest = verdicts.at(-1);
              const reviewed = latest && latest.sha === head.oid && latest.commit === head.oid;
              const openThreads = p.reviewThreads.nodes.filter(t => !t.isResolved).length;

              // Three fix rounds with changes still needed: a person decides, for good.
              if (verdicts.some(v => v.verdict !== 'pass' && v.round - 1 >= 3)) reasons.push('three review fix rounds used');

              // Copilot was asked to fix this commit's review (review-followup.yml) and has
              // not pushed since: after the timeout, a person looks.
              const asked = p.comments.nodes.filter(c => (c.body ?? '').includes(`<!-- review-pr:asked sha=${head.oid}`)).at(-1);
              const timeoutHours = policy.copilot_fix_timeout_hours ?? 24;
              if (asked && Date.now() - Date.parse(asked.createdAt) > timeoutHours * 3600000) {
                reasons.push(`Copilot was asked to fix the review over ${timeoutHours} hours ago and has not pushed`);
              }

              const waits = [];
              if (checks !== 'SUCCESS') waits.push(`checks are ${checks}`);
              if (!latest) waits.push('no review yet');
              else if (!reviewed) waits.push('the reviewer has not reviewed the latest commit');
              else if (latest.verdict !== 'pass') waits.push(`the review needs changes (round ${latest.round})`);
              if (openThreads) waits.push(`${openThreads} unresolved review thread(s)`);
              const tier = reasons.length ? 1 : 0;

              // The hold: once everything else is done, the gate posts one notice per
              // commit, naming the people in hold_notify, and the hold runs from that
              // notice, so the chance to add `hold` is always seen, even when a run is
              // late. All times are GitHub's own, never the commit date, which whoever
              // pushes can set: ready for review, the reviewer's review of the head
              // commit, and the notice.
              const holdNotice = `<!-- merge-gate:hold-notice sha=${head.oid} -->`;
              let noticedAt = p.comments.nodes.filter(c => (c.body ?? '').includes(holdNotice)).at(-1)?.createdAt;
              const readyAt = p.timelineItems.nodes[0]?.createdAt ?? pr.created_at;
              let since = Math.max(Date.parse(readyAt), reviewed ? Date.parse(latest.submittedAt) : Date.now());
              if (policy.mode === 'auto' && tier === 0 && waits.length === 0 && !noticedAt) noticedAt = new Date().toISOString();
              if (noticedAt) since = Math.max(since, Date.parse(noticedAt));
              const holdEnds = since + policy.hold_minutes * 60000;
              const mergeAfter = new Date(holdEnds).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
              if (policy.mode === 'auto' && tier === 0 && waits.length === 0 && !p.comments.nodes.some(c => (c.body ?? '').includes(holdNotice))) {
                const who = (policy.hold_notify ?? []).map(name => `@${name}`).join(' ');
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body:
                  `${who ? who + ': t' : 'T'}he factory will approve and merge this pull request after ${mergeAfter}. ` +
                  'Checks are green, the review passed and no thread is open. Add the `hold` label to stop it.\n\n' + holdNotice });
              }
              if (Date.now() < holdEnds) waits.push(`the hold, until ${mergeAfter}`);

              // 3. The decision, written between the factory-notes markers
              const ready = tier === 0 && waits.length === 0;
              const note = tier === 1
                ? `**Merge gate (${policy.mode}): a person merges this.**\n${reasons.map(r => `- ${r}`).join('\n')}`
                : ready
                  ? `**Merge gate (${policy.mode}): tier 0, ready.** ` +
                    (policy.mode === 'auto' ? 'The factory is approving and merging it.' : 'In auto mode the factory would merge it now.')
                  : `**Merge gate (${policy.mode}): the factory may merge this** once nothing is waiting, ` +
                    `unless someone adds the \`hold\` label. Waiting for:\n${waits.map(w => `- ${w}`).join('\n')}`;
              if (ready && policy.mode === 'auto') toMerge.push({ number: pr.number, sha: head.oid, tickets: tickets.map(t => t.number) });

              const block = `<!-- factory-notes:start -->\n${note}\n<!-- factory-notes:end -->`;
              const body = pr.body ?? '';
              const marked = /<!-- factory-notes:start -->[\s\S]*?<!-- factory-notes:end -->/;
              const newBody = marked.test(body) ? body.replace(marked, () => block) : `${body}\n\n${block}`;
              if (newBody !== body) await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: newBody });

              const flagged = labels.includes('needs-person');
              if (tier === 1 && !flagged) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['needs-person'] });
              if (tier === 0 && flagged) await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: 'needs-person' });

              core.info(`#${pr.number}: tier ${tier}${tier ? ' (' + reasons.join('; ') + ')' : ready ? ', ready' : ' (waiting: ' + waits.join('; ') + ')'}`);
            }
            core.setOutput('merge', JSON.stringify(toMerge));

      # Only this step holds the App token, and only when there is something to merge.
      - name: Get App token
        id: app-token
        if: steps.decide.outputs.merge != '' && steps.decide.outputs.merge != '[]'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-pull-requests: write   # approve
          permission-contents: write        # merge
          permission-issues: write          # clear the ticket's stage label

      - name: Approve and merge tier 0
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          MERGE: ${{ steps.decide.outputs.merge }}
        run: |
          failed=0
          while read -r pr sha tickets; do
            echo "PR #$pr at $sha"
            # --match-head-commit: refuse if anything was pushed since the decision.
            if gh pr review "$pr" --repo "$REPO" --approve --body "Merge gate: tier 0, all conditions met." &&
               gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$sha"; then
              for t in $tickets; do
                gh issue edit "$t" --repo "$REPO" --remove-label "status:in-review" || true
              done
            else
              echo "::error::Could not approve or merge #$pr"
              failed=1
            fi
          done < <(echo "$MERGE" | jq -r '.[] | "\(.number) \(.sha) \(.tickets | join(" "))"')
          exit "$failed"
