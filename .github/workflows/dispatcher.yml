# Sends a ready agent ticket to the Copilot cloud agent. When an issue gets
# status:ready and also has route:agent (and is not a type:feature parent),
# it assigns Copilot and moves the ticket to status:in-progress.
#
# Assigning Copilot needs a user token, so that one step uses the
# COPILOT_ASSIGN_TOKEN fine-grained PAT: Copilot works as the token's owner.
# Everything else uses the job's own short-lived token.
name: Dispatcher

on:
  issues:
    types: [ labeled ]

permissions:
  issues: write
  actions: write # start copilot-watch.yml

# This workflow acts, so runs queue; none is cancelled halfway through. A newer
# waiting run still replaces an older waiting one, so the group includes the
# label: other labels added at the same moment get their own queue and cannot
# replace a waiting status:ready run.
concurrency:
  group: dispatch-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.label.name == 'status:ready' &&
      contains(github.event.issue.labels.*.name, 'route:agent') &&
      !contains(github.event.issue.labels.*.name, 'type:feature')
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      # The event is a snapshot from when the label was added. Read the ticket
      # as it is now, so a repeated status:ready never dispatches it twice.
      - name: Check the ticket still needs dispatching
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$REPO/issues/$ISSUE" --jq '{labels: [.labels[].name], assignees: [.assignees[].login]}')
          echo "Now: $state"
          if echo "$state" | jq -e '(.labels | index("status:ready")) and ([.assignees[] | ascii_downcase | contains("copilot")] | any | not)' > /dev/null; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already dispatched, or no longer status:ready: nothing to do."
          fi

      - name: Assign Copilot
        if: steps.current.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: |
          gh api -X POST "repos/$REPO/issues/$ISSUE/assignees" --input - <<EOF
          {"assignees": ["copilot-swe-agent[bot]"],
           "agent_assignment": {"target_repo": "$REPO", "base_branch": "master"}}
          EOF

      # The assignees API silently ignores assignees it cannot add, so a
      # missing or expired token would otherwise look like success.
      - name: Check Copilot was assigned
        if: steps.current.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          logins=$(gh api "repos/$REPO/issues/$ISSUE" --jq '[.assignees[].login] | join(",")')
          echo "Assignees: $logins"
          case "$logins" in
            *Copilot*|*copilot*) ;;
            *) echo "::error::Copilot was not assigned"; exit 1 ;;
          esac

      - name: Move to in-progress
        if: steps.current.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --remove-label "status:ready" --add-label "status:in-progress"

      # GitHub runs mark-ready's schedule hours late and holds its other trigger,
      # so watch for Copilot to finish and start mark-ready then.
      - name: Watch for Copilot to finish
        if: steps.current.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run copilot-watch.yml --repo "$REPO" --ref master
